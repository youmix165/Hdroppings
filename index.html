<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>H-dropping 聞き取りミニテスト</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;max-width:620px;margin:0 auto;padding:28px 20px;background:#fafafa;color:#222}
  .card{background:white;border-radius:18px;padding:24px;box-shadow:0 3px 18px #00000012}
  h1{font-size:24px;margin-top:0}
  .sub{color:#666}
  button{border:0;border-radius:12px;padding:13px 18px;font-size:16px;cursor:pointer}
  #listen{width:100%;font-size:20px;margin:18px 0;background:#eee}
  input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #ccc;border-radius:10px;font-size:17px}
  #answer{margin-top:12px;width:100%;background:#222;color:white}
  .result{margin-top:20px;padding:16px;border-radius:12px;background:#f3f3f3}
  .hidden{display:none}
  .small{font-size:13px;color:#777}
  .next{margin-top:14px;background:#eee}
</style>
</head>
<body>
<div class="card">
  <h1>🎧 H-dropping 聞き取りミニテスト</h1>
  <p class="sub">音声を聞いて、聞こえた英文を入力してね。</p>
  <p id="count"></p>

  <button id="listen">🔊 音声を再生</button>

  <input id="userAnswer" autocomplete="off" placeholder="聞こえた英文を入力">
  <button id="answer">回答する</button>

  <div id="result" class="result hidden"></div>
  <button id="next" class="next hidden">次の問題 →</button>
</div>

<script>
const questions = [
  {
    normal: "I told him about it.",
    spoken: "I told 'im about it.",
    explanation: "him の h が落ちて、'im のように聞こえるパターン。"
  },
  {
    normal: "Tell him I called.",
    spoken: "Tell 'im I called.",
    explanation: "him の h が落ちて、'im のように聞こえるパターン。"
  },
  {
    normal: "I should have told him.",
    spoken: "I should've told 'im.",
    explanation: "him の h が落ちて、'im のように聞こえるパターン。"
  },
  {
    normal: "Give her a minute.",
    spoken: "Give 'er a minute.",
    explanation: "her の h が落ちて、'er のように聞こえるパターン。"
  },
  {
    normal: "I saw him at the station.",
    spoken: "I saw 'im at the station.",
    explanation: "him の h が落ちて、'im のように聞こえるパターン。"
  },
  {
    normal: "She told her about the meeting.",
    spoken: "She told 'er about the meeting.",
    explanation: "her の h が落ちて、'er のように聞こえるパターン。"
  },
  {
    normal: "She called him yesterday.",
    spoken: "She called 'im yesterday.",
    explanation: "him の h が落ちて、'im のように聞こえるパターン。"
  },
  {
    normal: "Can you help her with this?",
    spoken: "Can you help 'er with this?",
    explanation: "her の h が落ちて、'er のように聞こえるパターン。"
  }
];
let current = 0;

const count = document.getElementById("count");
const listen = document.getElementById("listen");
const input = document.getElementById("userAnswer");
const answer = document.getElementById("answer");
const result = document.getElementById("result");
const next = document.getElementById("next");

function showQuestion(){
  count.textContent = `第 ${current+1} 問 / ${questions.length}`;
  input.value = "";
  result.classList.add("hidden");
  next.classList.add("hidden");
  input.focus();
}
function speak(){
  const audio = new Audio("q1.mp3");
  audio.play();
}
listen.addEventListener("click", speak);

answer.addEventListener("click", ()=>{
  const q = questions[current];
  const normalize = s => s.toLowerCase().replace(/[.,!?'"’]/g,"").replace(/\s+/g," ").trim();
  const ok = normalize(input.value) === normalize(q.normal);

  result.innerHTML = `
    <strong>${ok ? "✅ 正解！" : "❌ 惜しい！"}</strong>
    <p><b>正解：</b>${q.normal}</p>
    <p><b>実際の音：</b>${q.spoken}</p>
    <p>💡 ${q.explanation}</p>
    ${!ok ? `<p class="small">yumiの回答：${input.value || "（未入力）"}</p>` : ""}
  `;
  result.classList.remove("hidden");
  next.classList.remove("hidden");
});

next.addEventListener("click", ()=>{
  current++;
  if(current >= questions.length){
    document.querySelector(".card").innerHTML = `
      <h1>🎉 おつかれさま！</h1>
      <p>5問終了！</p>
      <button class="next" onclick="location.reload()">もう一度やる</button>
    `;
  } else {
    showQuestion();
  }
});

input.addEventListener("keydown", e => {
  if(e.key === "Enter") answer.click();
});

showQuestion();
</script>
</body>
</html>
